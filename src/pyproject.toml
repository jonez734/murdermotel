[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "murdermotel"
dynamic = ["version"]
description = "Turn-based assassination game built upon bbsengine6"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "GPL-2.0-or-later"
authors = [
    { name = "zoidtechnologies.com", email = "murdermotel@projects.zoidtechnologies.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: BBS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "bbsengine6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
murdermotel = "murdermotel.__main__:main"

[project.urls]
Homepage = "https://zoidtechnologies.com/murdermotel/"

[tool.setuptools.packages.find]
where = ["."]
include = ["murdermotel*"]

[tool.setuptools.dynamic]
version = { attr = "murdermotel._version.__version__" }

[tool.setuptools.package-data]
murdermotel = ["data/*.txt", "data/sql/*.sql"]
